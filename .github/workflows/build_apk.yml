name: Vérifier et compiler la mise à jour Android

on:
  pull_request:
  push:
    branches: [main, master, feature/scanner-vitres-cm]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  release:
    name: APK de mise à jour signé
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      MK_KEYSTORE_BASE64: ${{ secrets.MK_KEYSTORE_BASE64 }}
      MK_KEYSTORE_PASSWORD: ${{ secrets.MK_KEYSTORE_PASSWORD }}
      MK_KEY_PASSWORD: ${{ secrets.MK_KEY_PASSWORD }}
      MK_KEY_ALIAS: ${{ secrets.MK_KEY_ALIAS }}
      MK_KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore/mk-suite-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Charger la clé de signature existante
        shell: python
        run: |
          import base64
          import os
          from pathlib import Path
          required = ('MK_KEYSTORE_BASE64', 'MK_KEYSTORE_PASSWORD', 'MK_KEY_PASSWORD')
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Configurez les secrets MK de la clé d’origine. Aucun APK de remplacement ne sera publié sans cette clé.')
          target = Path(os.environ['MK_KEYSTORE_PATH'])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(base64.b64decode(os.environ['MK_KEYSTORE_BASE64'], validate=True))
          target.chmod(0o600)
      - run: flutter pub get
      - name: Compiler la mise à jour
        run: flutter build apk --release
      - name: Vérifier la signature et l’identité de l’APK
        shell: bash
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          "$build_tools/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk > /tmp/mk-badging.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          badging = Path('/tmp/mk-badging.txt').read_text()
          match = re.search(r"package: name='([^']+)' versionCode='(\d+)'", badging)
          if not match or match[1] != 'com.mkentreprise.mk_suite':
              raise SystemExit('Identifiant Android incorrect : publication annulée.')
          if int(match[2]) < 3:
              raise SystemExit('Numéro de version incorrect : publication annulée.')
          PY
      - name: Publier uniquement l’APK de mise à jour
        uses: actions/upload-artifact@v4
        with:
          name: mk-suite-mise-a-jour-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Retirer la clé du runner
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          Path(os.environ['MK_KEYSTORE_PATH']).unlink(missing_ok=True)
