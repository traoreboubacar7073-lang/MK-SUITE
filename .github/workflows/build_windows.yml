name: Vérifier et compiler MK Suite Windows
on:
  push:
    branches: [main, master, feature/scanner-vitres-cm]
    paths: ['desktop/**', '.github/workflows/build_windows.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/build_windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tester les échanges et migrations
        run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements.txt
      - name: Vérifier le démarrage des modules
        run: python -c "import main; import modules.calcul_vitres; import modules.synchronisation"
      - name: Compiler le logiciel
        run: python -m PyInstaller --noconfirm --clean --name MK_Suite --windowed --onefile --icon assets/icon.ico --add-data "assets/icon.ico;assets" --add-data "../assets/images/logo.png;assets" --collect-all customtkinter --hidden-import PIL._tkinter_finder main.py
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: mk-suite-windows-mise-a-jour
          path: desktop/dist/MK_Suite.exe
          if-no-files-found: error
