org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Désactive le Kotlin intégré automatique d'AGP 9 (qui impose la version
# 2.2.10, trop ancienne pour Flutter) — on applique notre propre plugin
# Kotlin explicitement, avec une version plus récente, à la place.
android.builtInKotlin=false
