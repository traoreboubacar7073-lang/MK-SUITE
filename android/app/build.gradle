plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    // Le plugin Gradle de Flutter doit être appliqué en dernier.
    id("dev.flutter.flutter-gradle-plugin")
}

// Keep the existing signing identity, but obtain credentials from the build
// environment. Never commit keystores or passwords to the repository.
def signingStorePath = System.getenv("MK_KEYSTORE_PATH") ?: "keystore/mk-suite-release.jks"
def signingStorePassword = System.getenv("MK_KEYSTORE_PASSWORD")
def signingKeyPassword = System.getenv("MK_KEY_PASSWORD")
def signingKeyAlias = System.getenv("MK_KEY_ALIAS") ?: "mk-suite"
def hasReleaseSigning = signingStorePassword && signingKeyPassword && file(signingStorePath).exists()

android {
    namespace = "com.mkentreprise.mk_suite"
    // Utilise la même valeur partagée que toutes les extensions (voir
    // .github/workflows/build_apk.yml, qui force cette valeur commune à
    // 36 avant la compilation) — une seule source de vérité, plus besoin
    // de la fixer séparément ici.
    // Fixé explicitement (indépendamment de la valeur par défaut de
    // Flutter, qui s'est révélée trop basse pour certaines extensions).
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // Identifiant unique de l'application — à ne pas changer une fois
        // publiée quelque part, sinon Android la considère comme une
        // application différente.
        applicationId = "com.mkentreprise.mk_suite"
        minSdk = Math.max(24, flutter.minSdkVersion)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(signingStorePath)
                storePassword = signingStorePassword
                keyAlias = signingKeyAlias
                keyPassword = signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-test"
        }
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    lint {
        // L'outil d'analyse de code "lint" peut planter sur certains
        // paquets tiers avec les toutes dernières versions d'AGP (bug
        // connu, sans rapport avec la qualité réelle du code). On évite
        // que ça bloque la génération de l'application.
        checkReleaseBuilds = false
        abortOnError = false
    }
}

flutter {
    source = "../.."
}

// Fail explicitly instead of accidentally distributing an unsigned release.
gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseSigning && graph.allTasks.any { it.name == "assembleRelease" || it.name == "bundleRelease" }) {
        throw new GradleException("Release signing is not configured. Supply the existing keystore and MK signing environment variables.")
    }
}
